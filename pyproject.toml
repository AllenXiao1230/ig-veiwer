[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ig-viewer-offline"
version = "3.0.0"
description = "Offline desktop viewer for Instagram export JSON files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6==6.11.1"]

[project.scripts]
ig-viewer = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["igviewer*"]

[tool.setuptools.package-data]
igviewer = ["assets/ig-viewer.ico"]
